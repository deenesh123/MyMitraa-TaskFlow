server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mymitraa-taskflow
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mymitraa_taskflow}
      database: ${MONGODB_DATABASE:mymitraa_taskflow}
      auto-index-creation: true
  mail:
    host: ${ZOHO_SMTP_HOST:smtp.zoho.com}
    port: ${ZOHO_SMTP_PORT:465}
    username: ${ZOHO_SMTP_USER:}
    password: ${ZOHO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:MyMitraaTaskFlowSecureJwtSecretKeyForTokenSigning2026}
    expiration: ${JWT_EXPIRATION:86400000}
  mail:
    from-email: ${ZOHO_FROM_EMAIL:notifications@mymitraa.com}
    from-name: ${ZOHO_FROM_NAME:MyMitraa TaskFlow}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

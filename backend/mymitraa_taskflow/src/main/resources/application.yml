server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  main:
    allow-circular-references: true
  application:
    name: mymitraa-taskflow
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:mymitraa_taskflow}}
      database: ${MONGODB_DATABASE:mymitraa_taskflow}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  mail:
    host: ${ZOHO_SMTP_HOST:smtp.zoho.com}
    port: ${ZOHO_SMTP_PORT:465}
    username: ${ZOHO_SMTP_USER:}
    password: ${ZOHO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            enable: true
            trust: "*"
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  upload-path: ${UPLOAD_PATH:/tmp/mymitraa_uploads}
  history-uploads: history_uploads

mymitraa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpc2lzYXZlcnlzZWN1cmVqd3RzZWNyZXRmb3JteW1pdHJhYXRhc2tmbG93YXBwbGljYXRpb24yMDI2}
      expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  mail:
    from-email: ${ZOHO_FROM_EMAIL:notifications@mymitraa.com}
    from-name: ${ZOHO_FROM_NAME:MY MiTRAA TaskFlow}

jwt:
  secret: ${JWT_SECRET:dGhpc2lzYXZlcnlzZWN1cmVqd3RzZWNyZXRmb3JteW1pdHJhYXRhc2tmbG93YXBwbGljYXRpb24yMDI2}
  expiration: ${JWT_EXPIRATION_SECONDS:86400}

